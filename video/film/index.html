<script>
// 《一条命令，接上七牛》画面 v2
// 约定：window.DUR 总时长；window.render(t) 画出 t 秒这一帧；window.READY 字体就绪
// 渲染必须确定：不用 Date.now()、不用 Math.random()、帧间不留状态
// v2：角色有呼吸、眨眼、预备与回弹；镜头带手持漂移；镜头之间用推移 / 甩镜 / 缩放转场
const W = 1920, H = 1080;
const MAIN = document.getElementById('c').getContext('2d');
let ctx = MAIN;      // 转场时临时指向离屏画布
let TIME = 0;        // 当前全片时间，供呼吸、眨眼、手持漂移使用

const C = {
  bg0: '#040507', bg1: '#0f141a',
  win: '#0a0d12', winEdge: '#1e252e', bar: '#10151b',
  fg: '#d6dde6', white: '#f5f7fa', muted: '#6b7280', dim: '#3b424c',
  claude: '#d97757', eye: '#1a0f0b',
  qiniu: '#00b4e6', qiniuHi: '#5fe0ff', qiniuDeep: '#005c99', ok: '#00e5a0',
  model: '#7ee787',
};
const GRAD = ['#00D4FF', '#00B4E6', '#0094CC', '#0078B3', '#005C99', '#004080'];
const MONO = '"JetBrains Mono", "DejaVu Sans Mono", monospace';
const CJK = '"WenQuanYi Zen Hei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif';
const BPM = 96, BEAT = 60 / BPM, BAR = BEAT * 4;

// ---------- 小工具 ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = (k) => 1 - Math.pow(1 - clamp(k), 3);
const easeInOut = (k) => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
// 回弹：冲过头再落回，用于弹出的元素
const easeBack = (k) => { k = clamp(k); const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const frac = (x) => x - Math.floor(x);
// 带种子的哈希随机，0..1
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const isWide = (ch) => /[⺀-鿿豈-﫿︰-﹏＀-￯]/.test(ch);
const dispWidth = (s) => [...s].reduce((n, ch) => n + (isWide(ch) ? 2 : 1), 0);
const pad = (s, n) => s + ' '.repeat(Math.max(0, n - dispWidth(s)));

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// 等宽排版：segs = [[文字, 颜色, {bold, glow, alpha}]]，CJK 占两格；逐字画在固定格上，避开连字
function text(segs, x, y, size, col0 = 0) {
  const cw = size * 0.6;
  let col = col0;
  ctx.textBaseline = 'middle';
  for (const [s, color, o = {}] of segs) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.globalAlpha *= o.alpha ?? 1;
    if (o.glow) { ctx.shadowColor = color; ctx.shadowBlur = o.glow; }
    const weight = o.bold ? 700 : 400;
    for (const ch of s) {
      if (ch === ' ') { col++; continue; }
      if (ch.charCodeAt(0) < 128) {
        ctx.font = `${weight} ${size}px ${MONO}`;
        ctx.fillText(ch, x + col * cw, y);
        col++; continue;
      }
      const wide = isWide(ch);
      ctx.font = `${weight} ${wide ? size * 0.98 : size}px ${wide ? CJK : MONO}`;
      const span = wide ? 2 : 1;
      const m = ctx.measureText(ch).width;
      ctx.fillText(ch, x + col * cw + (span * cw - m) / 2, y);
      col += span;
    }
    ctx.restore();
  }
  return col;
}
function label(s, x, y, size, color, o = {}) {
  ctx.save();
  ctx.globalAlpha *= o.alpha ?? 1;
  ctx.font = `${o.bold ? 700 : 400} ${size}px ${o.mono ? MONO : CJK}`;
  ctx.fillStyle = color; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.glow) { ctx.shadowColor = color; ctx.shadowBlur = o.glow; }
  ctx.fillText(s, x, y);
  ctx.restore();
}

// ---------- 背景、窗口、镜头 ----------
function backdrop(tint = 0) {
  const g = ctx.createRadialGradient(W / 2, H * .45, 80, W / 2, H / 2, W * .75);
  g.addColorStop(0, tint ? `rgba(0,${lerp(20, 70, tint) | 0},${lerp(26, 110, tint) | 0},1)` : C.bg1);
  g.addColorStop(1, C.bg0);
  ctx.fillStyle = g; ctx.fillRect(-W, -H, W * 3, H * 3);
  ctx.fillStyle = 'rgba(255,255,255,0.035)';
  for (let y = 24; y < H; y += 48) for (let x = 24; x < W; x += 48) ctx.fillRect(x, y, 2, 2);
}
function vignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, W * .72);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
const WIN = { x: 150, y: 80, w: 1620, h: 900, bar: 46 };
const L_WIN = { x: 90, y: 110, w: 840, h: 820, bar: 46 };
const R_WIN = { x: 990, y: 110, w: 840, h: 820, bar: 46 };
function terminal(title, glowColor, R = WIN) {
  const { x, y, w, h, bar } = R;
  ctx.save();
  ctx.shadowColor = glowColor || 'rgba(0,0,0,0.8)'; ctx.shadowBlur = glowColor ? 90 : 60; ctx.shadowOffsetY = glowColor ? 0 : 24;
  rr(x, y, w, h, 18); ctx.fillStyle = C.win; ctx.fill();
  ctx.restore();
  rr(x, y, w, h, 18); ctx.strokeStyle = C.winEdge; ctx.lineWidth = 2; ctx.stroke();
  ctx.save(); rr(x, y, w, h, 18); ctx.clip();
  ctx.fillStyle = C.bar; ctx.fillRect(x, y, w, bar);
  ctx.fillStyle = C.winEdge; ctx.fillRect(x, y + bar, w, 1);
  ['#4a3a38', '#4a4536', '#36443a'].forEach((c, i) => {
    ctx.beginPath(); ctx.arc(x + 28 + i * 24, y + bar / 2, 7, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill();
  });
  ctx.restore();
  label(title, x + w / 2, y + bar / 2, 20, C.muted, { mono: true });
}
function clipWindow(R = WIN) { const { x, y, w, h, bar } = R; rr(x, y + bar, w, h - bar, 18); ctx.clip(); }
// 镜头：以 (fx, fy) 为中心缩放 + 平移，并叠加轻微的手持漂移
function camera(s, fx = W / 2, fy = H / 2, dx = 0, dy = 0, drift = 1) {
  const hx = (Math.sin(TIME * 0.9) * 5 + Math.sin(TIME * 2.1 + 1.3) * 2) * drift;
  const hy = (Math.cos(TIME * 0.7) * 4 + Math.sin(TIME * 1.7 + .4) * 2) * drift;
  ctx.setTransform(s, 0, 0, s, fx - fx * s + dx + hx, fy - fy * s + dy + hy);
}
function shotEnd() { ctx.setTransform(1, 0, 0, 1, 0, 0); }
function cursor(x, y, size, on) { if (on) { ctx.fillStyle = C.fg; ctx.fillRect(x, y - size * .6, size * .6, size * 1.2); } }
const blinkOn = (u) => Math.floor(u / (BEAT / 2)) % 2 === 0;
const SPIN = ['·', '✢', '✳', '✶', '✻', '✽'];
const spinner = (u) => SPIN[Math.floor(u / .12) % SPIN.length];
const Q = (s) => [['? ', C.ok, { bold: true }], [s, C.white, { bold: true }]];
const DONE = (s, ans) => [['✔ ', C.ok], [s + ' ', C.white], [ans, C.qiniu]];
function bez(p, k) {
  const m = 1 - k;
  return [m * m * m * p[0][0] + 3 * m * m * k * p[1][0] + 3 * m * k * k * p[2][0] + k * k * k * p[3][0],
          m * m * m * p[0][1] + 3 * m * m * k * p[1][1] + 3 * m * k * k * p[2][1] + k * k * k * p[3][1]];
}
function glowDot(x, y, r, color, a = 1) {
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = r * 4;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
// 弹出缩放：在 (x, y) 处按 k 缩放后调用 fn
function popAt(x, y, k, fn) {
  if (k <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(easeBack(k), easeBack(k)); ctx.globalAlpha *= clamp(k * 3); fn(); ctx.restore();
}
function sparks(x, y, life, n = 18, color = C.qiniuHi, seed = 0, reach = 160) {
  if (life <= 0 || life >= 1) return;
  for (let i = 0; i < n; i++) {
    const a = hash(i + seed) * Math.PI * 2, r = (40 + hash(i + 50 + seed) * reach) * easeOut(life);
    ctx.save(); ctx.globalAlpha *= 1 - life; ctx.strokeStyle = i % 3 ? color : '#ffffff'; ctx.lineWidth = 3;
    ctx.shadowColor = color; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r * .6, y + Math.sin(a) * r * .6);
    ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); ctx.stroke(); ctx.restore();
  }
}
function ring(x, y, life, color = C.qiniu, maxR = 420, w = 6) {
  if (life <= 0 || life >= 1) return;
  ctx.save(); ctx.globalAlpha *= (1 - life) * .8; ctx.strokeStyle = color; ctx.lineWidth = w * (1 - life) + 1;
  ctx.shadowColor = color; ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.ellipse(x, y, maxR * easeOut(life), maxR * .32 * easeOut(life), 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
}

// ---------- 七牛 Logo（取自 src/lib/wizard/ui/logo.ts）----------
const LOGO = [
  '  ██████  ██ ███    ██ ██ ██    ██',
  ' ██    ██ ██ ████   ██ ██ ██    ██',
  ' ██    ██ ██ ██ ██  ██ ██ ██    ██',
  ' ██ ▄▄ ██ ██ ██  ██ ██ ██ ██    ██',
  '  ██████  ██ ██   ████ ██  ██████ ',
  '     ▀▀                           ',
];
function logo(x, y, cw, ch, lit) {
  LOGO.forEach((line, j) => {
    const a = lit[j];
    ctx.save();
    ctx.fillStyle = GRAD[j];
    ctx.globalAlpha *= lerp(0.07, 1, a);
    if (a > 0) { ctx.shadowColor = GRAD[j]; ctx.shadowBlur = 28 * a; }
    [...line].forEach((c, i) => {
      const px = x + i * cw, py = y + j * ch;
      if (c === '█') ctx.fillRect(px, py, cw + .5, ch + .5);
      else if (c === '▄') ctx.fillRect(px, py + ch / 2, cw + .5, ch / 2 + .5);
      else if (c === '▀') ctx.fillRect(px, py, cw + .5, ch / 2 + .5);
    });
    ctx.restore();
  });
}

// 官方 Logo 图片（logos.js 内嵌数据）
const LOGO_IMG = {};
Object.entries(window.LOGO_SRC || {}).forEach(([k, src]) => { const im = new Image(); im.src = src; LOGO_IMG[k] = im; });
function drawLogo(key, cx, cy, size) {
  const im = LOGO_IMG[key];
  if (im && im.complete && im.naturalWidth) ctx.drawImage(im, cx - size / 2, cy - size / 2, size, size);
}
const TOOLS13 = ['claude', 'codex', 'opencode', 'qwen', 'kimi', 'droid', 'grok', 'openclaw', 'minimax', 'copilot', 'codebuddy', 'workbuddy', 'hermes'];
Object.keys(CAST).forEach((id, i) => { CAST[id].phase = hash(i * 7 + 3); });

// 跳跃：t0 起跳；起跳前 80 ms 下蹲（预备），空中拉长，落地压扁并衰减回弹
function hopAt(u, t0, dur = 0.42, h = 40) {
  const a = u - t0;
  if (a > -0.08 && a < 0) return { y: 0, sq: 0.14 * (1 + a / 0.08) };
  if (a >= 0 && a < dur) { const k = a / dur; return { y: -4 * h * k * (1 - k), sq: -0.12 * Math.sin(Math.PI * k) }; }
  if (a >= dur && a < dur + 0.4) { const k = (a - dur) / 0.4; return { y: 0, sq: 0.18 * Math.exp(-k * 4) * Math.cos(k * 11) }; }
  return { y: 0, sq: 0 };
}
function hops(u, times, dur, h) {
  let y = 0, sq = 0;
  for (const t0 of times) { const r = hopAt(u, t0, dur, h); y += r.y; sq += r.sq; }
  return { y, sq };
}
// 踩拍跳：每 period 秒跳一次
function bounce(u, period = BEAT, h = 18, phase = 0) {
  const k = frac(u / period + phase);
  const y = -Math.sin(Math.PI * k) * h;
  const sq = k < .12 ? (1 - k / .12) * .16 : -Math.sin(Math.PI * k) * .06;
  return { y, sq };
}

// 画角色：(x, y) 为脚底中心，px 每格像素
// o: pose, squash, look（-1..1 眼睛看向左右）, blink（强制眨眼）, alpha, glow, shadow, still（不呼吸）
function sprite(id, x, y, px, o = {}) {
  const c = CAST[id];
  const map = c.maps[o.pose] || c.maps.idle;
  const rows = map.length, cols = map[0].length;
  const breathe = o.still ? 0 : Math.sin(TIME * Math.PI / BEAT * 0.5 + c.phase * 6.283) * 0.03;
  const sq = (o.squash || 0) + breathe;
  const sx = 1 + sq * 0.7, sy = 1 - sq;
  const pw = px * sx, ph = px * sy;
  const ox = x - cols * pw / 2, oy = y - rows * ph;
  const blink = o.blink ?? (frac(TIME / 2.9 + c.phase) < 0.045);
  const look = Math.round(clamp(o.look || 0, -1, 1));
  const X = (i) => Math.round(ox + i * pw), Y = (j) => Math.round(oy + j * ph);
  const bk = c.bk || 'B';
  ctx.save();
  ctx.globalAlpha *= o.alpha ?? 1;
  if (o.shadow !== false) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(x, y + px * .4, cols * px * .36 * (1 + sq * .5), px * .5, 0, 0, Math.PI * 2); ctx.fill();
  }
  // 同色像素合成一条路径一次填充，避免格间缝隙
  const groups = {};
  map.forEach((line, j) => [...line].forEach((ch, i) => {
    if (ch === '.') return;
    if (ch === 'E') {
      (groups[bk] ||= []).push([i, j]);
      if (!blink) {
        // 看向一侧：眼睛平移一格，越界的那一格就不画
        const ni = i + look;
        if (ni >= 0 && ni < cols && map[j][ni] !== '.') (groups.E ||= []).push([ni, j]);
      }
      return;
    }
    (groups[ch] ||= []).push([i, j]);
  }));
  const order = Object.keys(groups).filter((k) => k !== 'E').concat(groups.E ? ['E'] : []);
  for (const key of order) {
    ctx.save();
    ctx.beginPath();
    for (const [i, j] of groups[key]) ctx.rect(X(i), Y(j), X(i + 1) - X(i), Y(j + 1) - Y(j));
    ctx.fillStyle = c.pal[key] || '#ff00ff';
    if (key === 'B') { ctx.shadowColor = o.glow || c.pal.B; ctx.shadowBlur = px * (o.glow ? 4 : 1.5); }
    ctx.fill();
    ctx.restore();
  }
  // 铭牌：在 P 区域正中印 Logo（没有 Logo 的印字母）
  if (c.logo || c.plateText) {
    if (!c.plate) {
      let i0 = 99, j0 = 99, i1 = -1, j1 = -1;
      map.forEach((line, j) => [...line].forEach((ch, i) => { if (ch === 'P') { i0 = Math.min(i0, i); j0 = Math.min(j0, j); i1 = Math.max(i1, i); j1 = Math.max(j1, j); } }));
      c.plate = { i0, j0, i1, j1 };
    }
    const { i0, j0, i1, j1 } = c.plate;
    const px0 = X(i0), py0 = Y(j0), pw0 = X(i1 + 1) - px0, ph0 = Y(j1 + 1) - py0;
    const size = Math.min(pw0, ph0) * .86;
    if (c.logo) drawLogo(c.logo, px0 + pw0 / 2, py0 + ph0 / 2, size);
    else label(c.plateText, px0 + pw0 / 2, py0 + ph0 / 2 + 1, size * .62, c.pal.A, { mono: true, bold: true });
  }
  // 铃铛：小牛脖子上挂七牛 Logo
  if (c.bell) {
    const bx = x, by = oy + 9.7 * ph, r = 2.1 * px;
    ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.lineWidth = Math.max(2, px * .3); ctx.strokeStyle = '#0078b3'; ctx.stroke();
    drawLogo(c.bell, bx, by, r * 1.45);
  }
  ctx.restore();
  return { x, top: oy, left: ox, w: cols * pw, h: rows * ph, side: [ox, oy + rows * ph * .62] };
}
// 气泡：头顶冒出的符号
function bubble(s, x, y, k, color = C.claude, size = 54) {
  popAt(x, y, k, () => label(s, 0, 0, size, color, { bold: true, mono: true, glow: 16 }));
}
// 角色名牌
function nameTag(id, x, y, a = 1, size = 18) {
  label(CAST[id].name, x, y, size, C.muted, { alpha: a, mono: true });
}

// 线缆：从 a 到 b 的下垂曲线，lit 0..1 点亮，可带流动光点
function cable(a, b, lit, u = 0, sag = 80, flow = true) {
  const mx = (a[0] + b[0]) / 2, my = Math.max(a[1], b[1]) + sag;
  const P = [a, [lerp(a[0], mx, .6), my], [lerp(b[0], mx, .6), my], b];
  ctx.save(); ctx.lineCap = 'round';
  ctx.strokeStyle = lit > 0 ? C.qiniuDeep : '#262c34'; ctx.lineWidth = 9;
  if (lit > 0) { ctx.shadowColor = C.qiniu; ctx.shadowBlur = 18 * lit; }
  ctx.beginPath(); ctx.moveTo(...P[0]); ctx.bezierCurveTo(...P[1], ...P[2], ...P[3]); ctx.stroke();
  if (lit > 0) {
    ctx.globalAlpha *= lit; ctx.strokeStyle = C.qiniu; ctx.lineWidth = 3.5; ctx.stroke();
  }
  ctx.restore();
  if (lit > 0 && flow) for (let i = 0; i < 3; i++) glowDot(...bez(P, frac(u * .8 + i / 3)), 4, C.qiniuHi, lit);
}

// ---------- 字幕：cues.js 由 audio/srt.py 按旁白实际时长生成 ----------
const CUES = window.CUES || [];
function subtitle(t) {
  const cue = CUES.find(([a, b]) => t >= a && t < b);
  if (!cue) return;
  const [a, b, s] = cue;
  const alpha = clamp((t - a) / .15) * clamp((b - t) / .15);
  ctx.save();

  ctx.font = `500 44px ${CJK}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  rr(W / 2 - w / 2 - 28, H - 104, w + 56, 66, 6); ctx.fill();

// S01 0:00–0:05  Clawd 蹦进终端敲 claude，没反应；其他工具的角色也从窗口底边冒头，都是一脸问号
const PEEK = [['codex', .14], ['openclaw', .32], ['copilot', .68], ['qwen', .86]];
function S01(u) {
  backdrop();
  camera(lerp(1.0, 1.1, easeInOut(u / 5)), W * .5, H * .55);

  if (u < 2.05) cursor(X + end * S * .6 + 4, Y + LH, S, blinkOn(u));

  // 其他角色从窗口底边冒头

// S03 0:10–0:17.5  一行命令：工具 + Key + 模型，回车三个 ✔；小牛把线插进 Clawd
const ONE = [['npx qiniu-coding-helper ', C.white], ['claude ', C.claude], ['sk-••••••3f9a ', C.qiniu], ['deepseek/deepseek-v4-flash', C.model]];
function typed(segs, n) {
  const out = [];
  for (const [s, c, o] of segs) { if (n <= 0) break; out.push([s.slice(0, n), c, o]); n -= s.length; }

}
function S03(u) {

  if (u > 1.7) n += n2;

  // 参数标注：工具 / API Key / 模型（可省略）

  const tagOut = 1 - clamp((u - 4.3) / .3);
  tags.forEach(([col, len, s, color, t0]) => {
    const k = (u - t0) / .25;
    if (k <= 0 || tagOut <= 0) return;
    const cx = X + (col + len / 2) * cw;
    ctx.save(); ctx.globalAlpha *= tagOut;
    ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.globalAlpha *= clamp(k * 2);
    ctx.beginPath(); ctx.moveTo(X + col * cw, Y + 30); ctx.lineTo(X + (col + len) * cw, Y + 30); ctx.stroke();
    popAt(cx, Y + 74, k, () => {
      ctx.font = `500 26px ${CJK}`; const w = ctx.measureText(s).width;
      ctx.fillStyle = color; rr(-w / 2 - 14, -20, w + 28, 40, 20); ctx.fill();
      ctx.fillStyle = '#0a0d12'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, 0, 1);

    ctx.restore();
  });
  const dm = hops(u, checks.map((_, i) => .25 + i * BEAT / 2), .22, 12);
  sprite('cow', L_WIN.x + L_WIN.w - 140, L_WIN.y + L_WIN.h - 40 + dm.y, 8, { squash: dm.sq, look: -1 });
  ctx.restore();
  ctx.save(); clipWindow(R_WIN);
  X = R_WIN.x + 44; Y = R_WIN.y + R_WIN.bar + 50;
  text([['❯ ', C.qiniu], ['npx qiniu-coding-helper restore', C.white]], X, Y, S);
  if (u >= 1.9) text(DONE('确定要移除七牛配置并还原原有配置吗？', '是'), X, Y + LH * 1.2, S);
  const env = [['ANTHROPIC_BASE_URL', '"https://api.qnaigc.com"'], ['ANTHROPIC_AUTH_TOKEN', '"sk-••••3f9a"'],
    ['API_TIMEOUT_MS', '"3000000"'], ['CLAUDE_CODE_DISABLE_…', '"1"']];
  text([['~/.claude/settings.json', C.muted]], X, Y + LH * 2.6, S);
  env.forEach(([k, v], i) => {
    const gone = clamp((u - (2.5 + (env.length - 1 - i) * .33)) / .25);
    if (gone >= 1) return;
    const y = Y + LH * (3.6 + i);
    const jit = rw ? (hash(Math.floor(u * 24) + i) - .5) * 18 : 0;
    ctx.save(); ctx.globalAlpha *= 1 - gone;
    text([['  ' + k + ': ', C.claude], [v, C.qiniu]], X + jit, y, S);
    if (gone > 0) { ctx.fillStyle = C.claude; ctx.fillRect(X, y - 1, (dispWidth(k + v) + 4) * S * .6 * gone, 3); }
    ctx.restore();
  });
  if (u >= 4.0) {
    const k = easeOut((u - 4.0) / .2);
    text([['✔ ', C.ok], ['已还原 Claude Code：七牛配置已移除，原值已写回', C.fg, { alpha: k }]], X, Y + LH * 3.8, S);
  }
  if (rw) {
    for (let i = 0; i < 7; i++) {
      const y = R_WIN.y + ((hash(i + Math.floor(u * 12)) * R_WIN.h) | 0);
      ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(R_WIN.x, y, R_WIN.w, 3 + hash(i) * 6);
    }
    if (Math.floor(u / (BEAT / 2)) % 2 === 0) label('◀◀ REWIND', R_WIN.x + R_WIN.w - 150, R_WIN.y + R_WIN.h - 50, 32, C.claude, { mono: true, bold: true });
  }
  const rm = hopAt(u, 4.05, .4, 30);
  sprite('claude', R_WIN.x + 150, R_WIN.y + R_WIN.h - 40 + rm.y, 8, { squash: rm.sq, look: 1, pose: u > 4.1 ? 'cheer' : 'idle' });
  ctx.restore();
  shotEnd();
}

// S10 1:05–1:15  呼应开场：同一个终端，这次 Clawd 一条命令配好全部；镜头拉远进入尾卡，角色一直在动，直到淡出
function endCard(u, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  logo(W / 2 - 34 * 13 / 2, 170, 13, 22, LOGO.map(() => 1));
  ctx.font = `700 64px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const segs = [['❯ ', C.qiniu], ['npx qiniu-coding-helper ', C.white], ['<工具> ', C.claude], ['sk-xxx', C.qiniu]];
  const total = segs.reduce((n, [s]) => n + dispWidth(s), 0);
  text(segs, W / 2 - total * 64 * .6 / 2, 400, 64);
  label('获取 API Key：portal.qiniu.com', W / 2, 480, 32, C.muted);
  ctx.restore();
}
function S10(u) {
  const out = easeInOut((u - 3.9) / 1.2);                 // 拉远进入尾卡
  backdrop(out * .5);
  camera(lerp(1.1, 1.0, easeInOut(u / 3)) * lerp(1, .55, out), W * .5, H * .4, 0, -out * 120);
  ctx.save(); ctx.globalAlpha *= 1 - out * .85;
  terminal('~/my-project — zsh');
  ctx.save(); clipWindow();
  const X = WIN.x + 64, Y = WIN.y + WIN.bar + 56, S = 30, LH = 46;
  text([['~/my-project', C.muted]], X, Y, S);
  const segs = [['npx qiniu-coding-helper ', C.white], ['all ', C.qiniu], ['sk-••••••3f9a', C.qiniu]];
  const n = Math.floor(clamp((u - .35) / 1.6) * 41);
  const end = text([['❯ ', C.qiniu], ...typed(segs, n)], X, Y + LH, S);
  const enter = 2.3;
  if (u < enter) cursor(X + end * S * .6 + 4, Y + LH, S, blinkOn(u));
  [[['✔ ', C.ok], ['API Key 有效（国内线路）', C.fg]],
   [['✔ ', C.ok], ['模型 deepseek/deepseek-v4-flash', C.fg], ['（自动选择）', C.muted]],
   [['✔ ', C.ok], ['已配置 8 个工具：Claude Code、Codex、OpenCode、Qwen Code…', C.fg]]].forEach((sg, i) => {
    const k = easeOut((u - (enter + .2 + i * BEAT / 2)) / .2);
    if (k > 0) { ctx.save(); ctx.globalAlpha *= k; text(sg, X, Y + LH * (2.3 + i), S * .85); ctx.restore(); }
  });
  ctx.restore(); ctx.restore();
  // Clawd 在终端里打字（跟开场同一位置），打完大家一起冒出来欢呼
  const GY = WIN.y + WIN.h - 40;
  const typingBob = u > .35 && u < 2.0 ? Math.abs(Math.sin((u - .35) * 26)) * .07 : 0;
  const ch = hopAt(u, enter + 1.0, .45, 60);
  const cheerBounce = u > enter + 1.6 ? bounce(u, BEAT, 22) : { y: 0, sq: 0 };
  sprite('claude', W * .5, GY + ch.y + cheerBounce.y, 14, { squash: typingBob + ch.sq + cheerBounce.sq, pose: u > enter + 1.0 ? (Math.floor(u / (BEAT / 2)) % 2 ? 'cheer' : 'wave') : 'idle' });
  const crew = ['cow', ...TOOLS13.slice(1)];
  crew.forEach((id, i) => {
    const t0 = enter + .9 + i * BEAT / 8;
    const k = easeBack((u - t0) / .35);
    if (u < t0) return;
    const side = i % 2 ? 1 : -1, rank = Math.floor(i / 2) + 1;
    const x = W * .5 + side * rank * 150;
    const b = bounce(u, BEAT, 18, i * .11);
    sprite(id, x, GY + lerp(260, 0, k) + b.y, id === 'cow' ? 11 : 9, { squash: b.sq, look: -side });
  });
  shotEnd();
  // 尾卡（不跟镜头缩放）；最后 0.7 s 淡出
  endCard(u, easeOut((u - 4.6) / .8));
  const fade = clamp((u - 9.3) / .7);
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- 镜头表与转场 ----------
// 第 5 列是进入该镜头的转场：cut 硬切、zoom 缩放穿越、whip 甩镜、push 推移
const SHOTS = [
  ['S01', 0, 5, S01, 'cut'], ['S02', 5, 10, S02, 'zoom'], ['S03', 10, 17.5, S03, 'whip'], ['S04', 17.5, 25, S04, 'push'],
  ['S05', 25, 37.5, S05, 'zoom'], ['S06', 37.5, 40, S06, 'push'], ['S07', 40, 50, S07, 'zoom'], ['S08', 50, 60, S08, 'zoom'],
  ['S09', 60, 65, S09, 'push'], ['S10', 65, 75, S10, 'push'],
];
const TW = 0.36; // 转场时长，跨在镜头边界两侧
const BUF = [0, 1].map(() => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; });
function drawShot(i, t) {
  const [, a, b, fn] = SHOTS[i];
  fn(clamp(t - a, 0, b - a + TW));
}
function composite(i, t) {
  const B = SHOTS[i][1], type = SHOTS[i][4];
  const p = clamp((t - (B - TW / 2)) / TW);
  const e = easeInOut(p);
  BUF.forEach((cv, k) => {
    ctx = cv.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.clearRect(0, 0, W, H);
    drawShot(k === 0 ? i - 1 : i, t);
  });
  ctx = MAIN;
  ctx.fillStyle = C.bg0; ctx.fillRect(0, 0, W, H);
  const blur = Math.sin(Math.PI * p);
  if (type === 'zoom') {
    ctx.save(); ctx.globalAlpha = 1 - e; ctx.translate(W / 2, H / 2); ctx.scale(1 + .6 * e, 1 + .6 * e); ctx.drawImage(BUF[0], -W / 2, -H / 2); ctx.restore();
    ctx.save(); ctx.globalAlpha = e; ctx.translate(W / 2, H / 2); ctx.scale(.85 + .15 * e, .85 + .15 * e); ctx.drawImage(BUF[1], -W / 2, -H / 2); ctx.restore();
  } else {
    // push / whip：整体横推，带拖影
    const ghosts = type === 'whip' ? 4 : 2, spread = type === 'whip' ? 60 : 24;
    for (let g = ghosts; g >= 0; g--) {
      ctx.save(); ctx.globalAlpha = g === 0 ? 1 : .25 * blur;
      const off = -e * W + g * spread * blur;
      ctx.drawImage(BUF[0], off, 0); ctx.drawImage(BUF[1], off + W, 0);
      ctx.restore();
    }
    if (type === 'whip') for (let k = 0; k < 24; k++) {
      ctx.fillStyle = `rgba(255,255,255,${.06 * blur * hash(k + 7)})`; ctx.fillRect(0, hash(k) * H, W, 2 + hash(k + 3) * 10);
    }
  }
}

// 角色设定稿
function castSheet() {
  backdrop();
  label('角色设定 · 13 款工具 + 七牛', 120, 90, 52, C.white, { align: 'left', bold: true });
  label('Clawd 按 Claude Code 启动 Logo 还原；其余为致敬造型，不使用官方 Logo', 120, 150, 24, C.muted, { align: 'left' });
  const all = ['cow', ...TOOLS13];
  all.forEach((id, i) => {
    const col = i % 7, row = Math.floor(i / 7);
    const x = 190 + col * 255, y = 470 + row * 380;
    const b = bounce(TIME, BEAT, 10, i * .1);
    sprite(id, x, y + b.y, id === 'cow' ? 13 : 11, { squash: b.sq });
    label(CAST[id].name, x, y + 50, 22, id === 'cow' ? C.qiniu : C.fg, { mono: true });
  });
  vignette();
}

window.DUR = 75;
window.render = function (t) {
  TIME = t;
  ctx = MAIN;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  ctx.clearRect(0, 0, W, H);
  if (new URLSearchParams(location.search).has('sheet')) return castSheet();
  let i = SHOTS.findIndex(([, a, b]) => t >= a && t < b);
  if (i < 0) i = SHOTS.length - 1;
  // 是否处在某个镜头边界的转场窗口里
  const near = SHOTS.findIndex(([, a], k) => k > 0 && Math.abs(t - a) < TW / 2 && SHOTS[k][4] !== 'cut');
  if (near > 0) composite(near, t);
  else drawShot(i, t);
  ctx = MAIN;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  vignette();
  subtitle(t);
};
window.READY = false;
Promise.all([...[`400 30px "JetBrains Mono"`, `700 30px "JetBrains Mono"`, `400 30px "WenQuanYi Zen Hei"`].map((f) => document.fonts.load(f)),
  ...Object.values(LOGO_IMG).map((im) => im.decode().catch(() => {}))])
  .finally(() => { window.READY = true; window.render(Number(new URLSearchParams(location.search).get('t') || 0)); });
</script>

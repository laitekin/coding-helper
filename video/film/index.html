<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>一条命令，接上七牛</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="cues.js"></script>
<script>
// 《一条命令，接上七牛》画面
// 约定：window.DUR 总时长；window.render(t) 画出 t 秒这一帧；window.READY 字体就绪
// 渲染必须确定：不用 Date.now()、不用 Math.random()、帧间不留状态
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  bg0: '#040507', bg1: '#0f141a',
  win: '#0a0d12', winEdge: '#1e252e', bar: '#10151b',
  fg: '#d6dde6', white: '#f5f7fa', muted: '#6b7280', dim: '#3b424c',
  claude: '#d97757', eye: '#1a0f0b',
  qiniu: '#00b4e6', qiniuHi: '#5fe0ff', qiniuDeep: '#005c99', ok: '#00e5a0',
};
const GRAD = ['#00D4FF', '#00B4E6', '#0094CC', '#0078B3', '#005C99', '#004080'];
const MONO = '"JetBrains Mono", "DejaVu Sans Mono", monospace';
const CJK = '"WenQuanYi Zen Hei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif';
const BPM = 96, BEAT = 60 / BPM, BAR = BEAT * 4;

// ---------- 小工具 ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = (k) => 1 - Math.pow(1 - clamp(k), 3);
const easeInOut = (k) => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
// 带种子的哈希随机，0..1
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const isWide = (ch) => /[⺀-鿿豈-﫿︰-﹏＀-￯]/.test(ch);
const dispWidth = (s) => [...s].reduce((n, ch) => n + (isWide(ch) ? 2 : 1), 0);
const pad = (s, n) => s + ' '.repeat(Math.max(0, n - dispWidth(s)));

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// 等宽排版：segs = [[文字, 颜色, {bold, glow, alpha}]]，CJK 占两格；返回结束时的格数
function text(segs, x, y, size, col0 = 0) {
  const cw = size * 0.6;
  let col = col0;
  ctx.textBaseline = 'middle';
  for (const [s, color, o = {}] of segs) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.globalAlpha *= o.alpha ?? 1;
    if (o.glow) { ctx.shadowColor = color; ctx.shadowBlur = o.glow; }
    const weight = o.bold ? 700 : 400;
    // 逐字画在固定格上：保证对齐，也避开 JetBrains Mono 的连字（<= == // 会被合成符号）
    for (const ch of s) {
      if (ch === ' ') { col++; continue; }
      if (ch.charCodeAt(0) < 128) {
        ctx.font = `${weight} ${size}px ${MONO}`;
        ctx.fillText(ch, x + col * cw, y);
        col++; continue;
      }
      const wide = isWide(ch);
      ctx.font = `${weight} ${wide ? size * 0.98 : size}px ${wide ? CJK : MONO}`;
      const span = wide ? 2 : 1;
      const m = ctx.measureText(ch).width;
      ctx.fillText(ch, x + col * cw + (span * cw - m) / 2, y);
      col += span;
    }
    ctx.restore();
  }
  return col;
}

// ---------- 背景与终端窗口 ----------
function backdrop() {
  const g = ctx.createRadialGradient(W / 2, H * .45, 80, W / 2, H / 2, W * .75);
  g.addColorStop(0, C.bg1); g.addColorStop(1, C.bg0);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,0.035)';
  for (let y = 24; y < H; y += 48) for (let x = 24; x < W; x += 48) ctx.fillRect(x, y, 2, 2);
}
function vignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, W * .72);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
const WIN = { x: 150, y: 80, w: 1620, h: 900, bar: 46 };
function terminal(title, glowColor, R = WIN) {
  const { x, y, w, h, bar } = R;
  ctx.save();
  ctx.shadowColor = glowColor || 'rgba(0,0,0,0.8)'; ctx.shadowBlur = glowColor ? 90 : 60; ctx.shadowOffsetY = glowColor ? 0 : 24;
  rr(x, y, w, h, 18); ctx.fillStyle = C.win; ctx.fill();
  ctx.restore();
  rr(x, y, w, h, 18); ctx.strokeStyle = C.winEdge; ctx.lineWidth = 2; ctx.stroke();
  ctx.save(); rr(x, y, w, h, 18); ctx.clip();
  ctx.fillStyle = C.bar; ctx.fillRect(x, y, w, bar);
  ctx.fillStyle = C.winEdge; ctx.fillRect(x, y + bar, w, 1);
  ['#4a3a38', '#4a4536', '#36443a'].forEach((c, i) => {
    ctx.beginPath(); ctx.arc(x + 28 + i * 24, y + bar / 2, 7, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill();
  });
  ctx.restore();
  ctx.font = `400 20px ${MONO}`; ctx.fillStyle = C.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(title, x + w / 2, y + bar / 2); ctx.textAlign = 'left';
}
function clipWindow(R = WIN) { const { x, y, w, h, bar } = R; rr(x, y + bar, w, h - bar, 18); ctx.clip(); }
// 镜头：以 (fx, fy) 为中心缩放 + 平移
function camera(s, fx = W / 2, fy = H / 2, dx = 0, dy = 0) { ctx.setTransform(s, 0, 0, s, fx - fx * s + dx, fy - fy * s + dy); }
function cursor(x, y, size, on) { if (on) { ctx.fillStyle = C.fg; ctx.fillRect(x, y - size * .6, size * .6, size * 1.2); } }

// ---------- Clawd（Claude Code 吉祥物）----------
// 由 Claude Code 启动界面的块字 Logo 逐格换算：
//    ▐▛███▜▌
//   ▝▜█████▛▘
//     ▘▘ ▝▝
// 每个四分之一块 = 1 格宽 × 2 格高，得到 18 × 10 方格；O 身体 K 眼睛
const CRAB = {
  idle: [
    '...OOOOOOOOOOOO...', '...OOOOOOOOOOOO...', '...OOKOOOOOOKOO...', '...OOKOOOOOOKOO...',
    '.OOOOOOOOOOOOOOOO.', '.OOOOOOOOOOOOOOOO.', '...OOOOOOOOOOOO...', '...OOOOOOOOOOOO...',
    '....O.O....O.O....', '....O.O....O.O....'],
  // 抬头：眼睛上移一格，左手举起
  curious: [
    '...OOOOOOOOOOOO...', '...OOKOOOOOOKOO...', '.OOOOKOOOOOOKOO...', '.OOOOOOOOOOOOOO...',
    '...OOOOOOOOOOOOOO.', '...OOOOOOOOOOOOOO.', '...OOOOOOOOOOOO...', '...OOOOOOOOOOOO...',
    '....O.O....O.O....', '....O.O....O.O....'],
  // 开心：眯眼（眼睛只剩下半格），双手举起
  happy: [
    '...OOOOOOOOOOOO...', '...OOOOOOOOOOOO...', '.OOOOOOOOOOOOOOOO.', '.OOOOKOOOOOOKOOOO.',
    '...OOOOOOOOOOOO...', '...OOOOOOOOOOOO...', '...OOOOOOOOOOOO...', '...OOOOOOOOOOOO...',
    '....O.O....O.O....', '....O.O....O.O....'],
};
const CRAB_COLOR = { O: C.claude, K: C.eye };
// (x, y) 为脚底中心；px 每格像素；squash 落拍压缩
function crab(pose, x, y, px, { squash = 0, socket = false, socketLit = 0 } = {}) {
  const map = CRAB[pose], rows = map.length, cols = map[0].length;
  const sy = 1 - squash, sx = 1 + squash * .6;
  const pw = px * sx, ph = px * sy;
  const ox = x - cols * pw / 2, oy = y - rows * ph;
  // 同色像素合成一条路径一次填充，避免格间缝隙；格边取整到相邻格的同一像素
  const X = (i) => Math.round(ox + i * pw), Y = (j) => Math.round(oy + j * ph);
  for (const key of ['O', 'K']) {
    ctx.save();
    ctx.beginPath();
    map.forEach((line, j) => [...line].forEach((ch, i) => {
      if (ch === key) ctx.rect(X(i), Y(j), X(i + 1) - X(i), Y(j + 1) - Y(j));
    }));
    ctx.fillStyle = CRAB_COLOR[key];
    if (key === 'O') { ctx.shadowColor = 'rgba(217,119,87,0.45)'; ctx.shadowBlur = px * 2.5; }
    ctx.fill();
    ctx.restore();
  }
  if (socket) {
    // 插座在身体左侧、手臂下方
    const sxp = ox + 3 * pw, syp = oy + 7 * ph;
    ctx.save();
    ctx.fillStyle = socketLit ? C.qiniu : '#2a3038';
    if (socketLit) { ctx.shadowColor = C.qiniu; ctx.shadowBlur = 30 * socketLit; }
    ctx.fillRect(sxp - pw * 1.2, syp - ph * .9, pw * 1.2, ph * 1.8);
    ctx.restore();
    return { x: sxp - pw * 1.2, y: syp };
  }
  // 脚下阴影
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(x, y + px * .4, cols * pw * .34, px * .5, 0, 0, Math.PI * 2); ctx.fill();
}

// ---------- 七牛 Logo（取自 src/lib/wizard/ui/logo.ts）----------
const LOGO = [
  '  ██████  ██ ███    ██ ██ ██    ██',
  ' ██    ██ ██ ████   ██ ██ ██    ██',
  ' ██    ██ ██ ██ ██  ██ ██ ██    ██',
  ' ██ ▄▄ ██ ██ ██  ██ ██ ██ ██    ██',
  '  ██████  ██ ██   ████ ██  ██████ ',
  '     ▀▀                           ',
];
function logo(x, y, cw, ch, lit) {
  LOGO.forEach((line, j) => {
    const a = lit[j];
    ctx.save();
    ctx.fillStyle = GRAD[j];
    ctx.globalAlpha = lerp(0.07, 1, a);
    if (a > 0) { ctx.shadowColor = GRAD[j]; ctx.shadowBlur = 28 * a; }
    [...line].forEach((c, i) => {
      const px = x + i * cw, py = y + j * ch;
      if (c === '█') ctx.fillRect(px, py, cw + .5, ch + .5);
      else if (c === '▄') ctx.fillRect(px, py + ch / 2, cw + .5, ch / 2 + .5);
      else if (c === '▀') ctx.fillRect(px, py, cw + .5, ch / 2 + .5);
    });
    ctx.restore();
  });
}

// ---------- 字幕：cues.js 由 audio/srt.py 按旁白实际时长生成 ----------
const CUES = window.CUES || [];
function subtitle(t) {
  const cue = CUES.find(([a, b]) => t >= a && t < b);
  if (!cue) return;
  const [a, b, s] = cue;
  const alpha = clamp((t - a) / .15) * clamp((b - t) / .15);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `500 44px ${CJK}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(s).width;
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  rr(W / 2 - w / 2 - 28, H - 104, w + 56, 66, 6); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.fillText(s, W / 2, H - 70);
  ctx.restore();
}

// ---------- 分镜 ----------
// S03 0:10–0:15  npx 启动，Logo 逐拍亮起，缓拉
function S03(u) {
  backdrop();
  camera(lerp(1.12, 1.0, easeInOut(u / 5)), W / 2, H * .42, W * .7 * (1 - easeOut(u / .3)));
  terminal('~/my-project — zsh');
  ctx.save(); clipWindow();
  const X = WIN.x + 64, Y = WIN.y + WIN.bar + 56, S = 30, LH = 46;
  text([['~/my-project', C.muted]], X, Y, S);
  const cmd = 'npx qiniu-coding-helper';
  const n = Math.floor(clamp((u - .15) / 1.0) * cmd.length);
  const end = text([['❯ ', C.qiniu], [cmd.slice(0, n), C.white]], X, Y + LH, S);
  cursor(X + end * S * .6 + 4, Y + LH, S, u < 1.3 && Math.floor(u / (BEAT / 2)) % 2 === 0);
  // 命令高亮框
  const hk = clamp((u - 1.3) / .25);
  if (hk > 0) {
    ctx.save(); ctx.globalAlpha = hk; ctx.strokeStyle = C.claude; ctx.lineWidth = 3;
    ctx.shadowColor = C.claude; ctx.shadowBlur = 16;
    rr(X + 2 * S * .6 - 12, Y + LH - 28, cmd.length * S * .6 + 24, 56, 6); ctx.stroke(); ctx.restore();
  }
  // Logo：第 5 小节第 3 拍起每拍亮一行
  const lit = LOGO.map((_, j) => easeOut((u - (1.25 + j * BEAT)) / .18));
  logo(X + 40, Y + LH * 2 + 40, 26, 44, lit);
  const ak = clamp((u - (1.25 + 5 * BEAT + .3)) / .3);
  const LY = Y + LH * 2 + 40 + 44 * 6 + 46;
  text([['            Coding Helper', C.qiniu, { bold: true, alpha: ak, glow: 18 }]], X + 40, LY, 30);
  text([['               v0.4.0', C.muted, { alpha: ak }]], X + 40, LY + 44, 26);
  // Clawd 从右下探头，抬头看 Logo
  const rise = easeOut((u - .8) / .8);
  crab('curious', WIN.x + WIN.w - 260, WIN.y + WIN.h + lerp(40, -60, rise), 13);
  ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

// S09 0:47.5–0:52.5  静音一小节 → 插上线缆 → 状态表翻牌
const TOOLS = [
  ['Claude Code', 'v2.1.304', 1], ['Codex', 'v0.58.0', 1], ['OpenCode', 'v1.2.4', 1], ['Qwen Code', 'v0.9.1', 1],
  ['Kimi Code CLI', 'v1.4.0', 1], ['Factory Droid', '未安装', 0], ['Grok CLI', '未安装', 0], ['OpenClaw', '未安装', 0],
  ['MiniMax Code', '未安装', 0], ['GitHub Copilot CLI', '未安装', 0], ['CodeBuddy', 'v2.3.0', 1], ['WorkBuddy', '桌面应用', 0],
  ['Hermes Agent', 'v0.7.2', 1],
];
const PLUG = 2.5; // 第 21 小节第 1 拍
function bez(p, k) {
  const m = 1 - k;
  return [m * m * m * p[0][0] + 3 * m * m * k * p[1][0] + 3 * m * k * k * p[2][0] + k * k * k * p[3][0],
          m * m * m * p[0][1] + 3 * m * m * k * p[1][1] + 3 * m * k * k * p[2][1] + k * k * k * p[3][1]];
}
function S09(u) {
  backdrop();
  const imp = u < PLUG ? 0 : (u - PLUG);
  const kick = imp > 0 ? Math.exp(-imp * 6) * Math.sin(imp * 30) * .012 + .035 * easeOut(imp / .4) : 0;
  const shake = imp > 0 && imp < .25 ? (hash(Math.floor(imp * 60)) - .5) * 14 * (1 - imp / .25) : 0;
  camera(1 + kick, W * .62, H * .55, shake, shake * .5);
  const lit = clamp(imp / .3);
  terminal('coding-helper status', lit ? `rgba(0,180,230,${0.25 * lit})` : null);
  ctx.save(); clipWindow();
  const X = WIN.x + 56, Y = WIN.y + WIN.bar + 46, S = 25, LH = 36;
  const pre = u < PLUG ? .55 : 1;
  ctx.globalAlpha = pre;
  text([['❯ ', C.qiniu], ['npx qiniu-coding-helper status', C.white]], X, Y, S);
  text([['  ──────────────── 接入状态 ────────────────', C.muted]], X, Y + LH * 1.5, S);
  text([['  线路       ', C.muted], ['https://api.qnaigc.com', C.fg]], X, Y + LH * 2.6, S);
  text([['  API Key    ', C.muted], ['sk-••••••••••3f9a', C.fg]], X, Y + LH * 3.6, S);
  const TY = Y + LH * 5;
  const c1 = 20, c2 = 10, c3 = 14;
  const hr = (l, m, r) => '  ' + l + '─'.repeat(c1) + m + '─'.repeat(c2) + m + '─'.repeat(c3) + r;
  text([[hr('╭', '┬', '╮'), C.dim]], X, TY, S);
  let col = text([['  │', C.dim], [pad(' 工具', c1), C.muted], ['│', C.dim], [pad(' 安装', c2), C.muted], ['│', C.dim], [pad(' 七牛', c3), C.muted], ['│', C.dim]], X, TY + LH, S);
  text([[hr('├', '┼', '┤'), C.dim]], X, TY + LH * 2, S);
  let k = 0;
  TOOLS.forEach(([name, ver, inst], i) => {
    const y = TY + LH * (3 + i);
    const c0 = text([['  │', C.dim], [pad(' ' + name, c1), C.fg], ['│', C.dim], [pad(' ' + ver, c2), inst ? C.fg : C.muted], ['│', C.dim]], X, y, S);
    // 翻牌：已安装的工具按八分音符依次翻
    let p = 0;
    if (inst) { p = clamp((u - (PLUG + k * BEAT / 2)) / .2); k++; }
    const on = p >= .5;
    const sy = Math.max(.04, Math.abs(Math.cos(Math.PI * p)));
    ctx.save();
    ctx.translate(0, y); ctx.scale(1, sy); ctx.translate(0, -y);
    const cell = on ? [[' ● 已接入七牛', C.ok, { glow: 14, bold: true }]] : [[' ○ 未接入', C.muted]];
    // 刚翻完的一行背景闪一下
    if (on && p < 1.5) {
      const fl = 1 - clamp((u - (PLUG + (k - 1) * BEAT / 2) - .1) / .5);
      if (fl > 0) { ctx.fillStyle = `rgba(0,229,160,${0.10 * fl})`; ctx.fillRect(X + c0 * S * .6, y - LH / 2, c3 * S * .6, LH); }
    }
    text(cell, X, y, S, c0);
    ctx.restore();
    text([['│', C.dim]], X, y, S, c0 + c3);
  });
  text([[hr('╰', '┴', '╯'), C.dim]], X, TY + LH * (3 + TOOLS.length), S);
  ctx.globalAlpha = 1;
  ctx.restore();

  // Clawd + 线缆（画在窗口之上，线缆从画面下方伸进来）
  const CX0 = 1490, CY0 = 640, PX = 14;
  const hop = imp > 0 ? Math.abs(Math.sin(Math.PI * clamp(imp / BEAT, 0, 1))) * (imp < BEAT ? 22 : 0) : 0;
  const sock = crab(imp > .15 ? 'happy' : 'idle', CX0, CY0 - hop, PX, { socket: true, socketLit: lit });
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(CX0, CY0 + 6, 18 * PX * .34, PX * .5, 0, 0, Math.PI * 2); ctx.fill();
  const P = [[1060, 1140], [1120, 860], [1240, sock.y + 40], [sock.x - 34, sock.y]];
  const reach = u < PLUG ? easeInOut(u / PLUG) * .985 : 1;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.shadowColor = C.qiniu; ctx.shadowBlur = 10 + 30 * lit;
  ctx.strokeStyle = C.qiniuDeep; ctx.lineWidth = 16;
  ctx.beginPath();
  for (let i = 0; i <= 60; i++) { const [px, py] = bez(P, reach * i / 60); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.stroke();
  ctx.strokeStyle = lit ? C.qiniu : '#0a6f96'; ctx.lineWidth = 6; ctx.stroke();
  ctx.restore();
  // 插头
  const [hx, hy] = bez(P, reach);
  ctx.save(); ctx.fillStyle = '#d9e6ee'; ctx.shadowColor = C.qiniu; ctx.shadowBlur = 20 * lit;
  rr(hx - 8, hy - 16, 38, 32, 5); ctx.fill(); ctx.restore();
  // 通电后线缆上流动的光点
  if (lit > 0) for (let i = 0; i < 5; i++) {
    const k2 = ((u * .9 + i / 5) % 1);
    const [px, py] = bez(P, k2);
    ctx.save(); ctx.fillStyle = C.qiniuHi; ctx.shadowColor = C.qiniuHi; ctx.shadowBlur = 24; ctx.globalAlpha = lit;
    ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  // 火花
  if (imp > 0 && imp < .6) {
    const life = imp / .6;
    for (let i = 0; i < 22; i++) {
      const a = hash(i) * Math.PI * 2, sp = 80 + hash(i + 50) * 220;
      const r = sp * easeOut(life);
      ctx.save(); ctx.globalAlpha = 1 - life; ctx.strokeStyle = i % 3 ? C.qiniuHi : '#ffffff'; ctx.lineWidth = 3;
      ctx.shadowColor = C.qiniu; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.moveTo(sock.x + Math.cos(a) * r * .55, sock.y + Math.sin(a) * r * .55);
      ctx.lineTo(sock.x + Math.cos(a) * r, sock.y + Math.sin(a) * r); ctx.stroke(); ctx.restore();
    }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // 插上瞬间的闪白
  if (imp > 0 && imp < .15) { ctx.fillStyle = `rgba(200,240,255,${.22 * (1 - imp / .15)})`; ctx.fillRect(0, 0, W, H); }
  if (u < PLUG) {
    ctx.font = `400 20px ${MONO}`; ctx.fillStyle = 'rgba(255,255,255,0.0)'; // 静音段无额外字
  }
}

// S10 0:52.5–1:02.5  Claude Code 欢迎框 → 提问 → 流式输出 → 跳切 /status
const CODE = [
  'def quick_sort(arr):',
  '    if len(arr) <= 1:',
  '        return arr',
  '    pivot = arr[len(arr) // 2]',
  '    left  = [x for x in arr if x < pivot]',
  '    mid   = [x for x in arr if x == pivot]',
  '    right = [x for x in arr if x > pivot]',

  return line.split(/(\b\w+\b|\s+|[^\w\s]+)/).filter(Boolean).map((tok) => {
    if (KW.test(tok)) return [tok, tok === 'len' ? '#7fd1ff' : '#e0a370'];
    if (tok === 'quick_sort') return [tok, '#7fd1ff'];
    if (/^\d+$/.test(tok)) return [tok, '#f7c66b'];
    if (/^[^\w\s]+$/.test(tok)) return [tok, '#9aa4b2'];
    return [tok, C.fg];
  });
}

    ['Haiku', '快速 / 轻量', 'anthropic/claude-haiku-4-5', 'haiku'],
    ['Sonnet', '平衡', 'anthropic/claude-sonnet-4-5', 'sonnet'],
    ['Opus', '强大', 'anthropic/claude-opus-4-1', 'opus'],
  ];
  const cwid = 470, gap = 40, top = Y + 70, hgt = 640;
  cols.forEach(([name, sub, pick, q], i) => {
    const x = X + i * (cwid + gap);
    const active = step === i, chosen = step > i;
    ctx.save();
    rr(x, top, cwid, hgt, 14);
    ctx.fillStyle = active ? '#140f0d' : '#0c1015'; ctx.fill();
    ctx.lineWidth = active ? 3 : 2; ctx.strokeStyle = active ? C.claude : chosen ? 'rgba(0,229,160,.6)' : C.winEdge;
    if (active) { ctx.shadowColor = C.claude; ctx.shadowBlur = 24; }
    ctx.stroke(); ctx.restore();
    ctx.save(); ctx.textBaseline = 'middle';
    ctx.font = `700 38px ${MONO}`; ctx.fillStyle = active ? C.claude : C.white; ctx.fillText(name, x + 28, top + 50);
    ctx.font = `400 24px ${CJK}`; ctx.fillStyle = C.muted; ctx.fillText(sub, x + 30, top + 92);
    ctx.restore();
    // 搜索框：只有 Sonnet 演示输入搜索
    const typing = i === 1 ? q.slice(0, Math.floor(clamp((u - 1.9) / 1.0) * q.length)) : '';
    const query = active ? typing : chosen ? '' : '';
    rr(x + 24, top + 128, cwid - 48, 52, 8); ctx.strokeStyle = active ? '#4b5563' : C.winEdge; ctx.lineWidth = 2; ctx.stroke();
    const qe = text([['⌕ ', C.muted], [query || (active ? '' : ''), C.white]], x + 40, top + 154, S);
    if (active) cursor(x + 40 + qe * cw + 2, top + 154, S, blinkOn(u));
    if (chosen) {
      text([['✔ ', C.ok], [pick, C.ok, { bold: true }]], x + 30, top + 240, S);
      return;
    }
    const list = MODELS.filter((m) => m.includes(query));
    // 当前列：光标先停在第一项，确认前一拍跳到目标模型
    const target = Math.max(0, list.indexOf(pick));
    const confirmAt = [1.25, 4.375, 6.25][i];
    const hi = active && u > confirmAt - BEAT * 1.5 ? target : 0;
    list.forEach((m, j) => {
      const y = top + 220 + j * LH * 1.15;
      const on = active && j === hi;
      if (on) { ctx.fillStyle = 'rgba(0,180,230,0.10)'; ctx.fillRect(x + 20, y - LH / 2, cwid - 40, LH); }
      text([[on ? '❯ ' : '  ', C.qiniu], [m, on ? C.qiniu : active ? C.fg : C.muted]], x + 28, y, S);
    });
  });
  ctx.restore();
  shotEnd();
}

// S08 0:42.5–0:47.5  分屏：左边写入 + 备份，右边 settings.json 逐行高亮
const L_WIN = { x: 90, y: 110, w: 840, h: 820, bar: 46 };
const R_WIN = { x: 990, y: 110, w: 840, h: 820, bar: 46 };
function S08(u) {
  backdrop();
  camera(1.0);
  terminal('coding-helper setup', null, L_WIN);
  terminal('~/.claude/settings.json', null, R_WIN);
  const S = 24, LH = 40;
  // 左：逐个写入
  ctx.save(); clipWindow(L_WIN);
  let X = L_WIN.x + 44, Y = L_WIN.y + L_WIN.bar + 50;
  text([['── 写入配置 ──', C.muted]], X, Y, S);
  const tools = ['Claude Code', 'Codex', 'OpenCode', 'Qwen Code', 'Kimi Code CLI', 'CodeBuddy', 'Hermes Agent'];
  tools.forEach((name, i) => {
    const at = .3 + i * BEAT / 2;
    if (u < at) return;
    const y = Y + LH * (1.4 + i);
    if (u < at + .28) text([[spinner(u) + ' ', C.claude, { glow: 10 }], [`正在写入 ${name}…`, C.fg]], X, y, S);
    else text([['✔ ', C.ok], [pad(name, 16), C.fg], ['成功', C.ok]], X, y, S);
  });
  const bk = u >= 3.6;
  if (bk) {
    const k = easeOut((u - 3.6) / .3);
    text([['已备份 7 个原文件到', C.muted, { alpha: k }]], X, Y + LH * 9.6, S);
    text([['~/.coding-helper/backups/', C.qiniu, { alpha: k, glow: 8 }]], X, Y + LH * 10.6, S);
    text([['  20261020-142318/', C.qiniu, { alpha: k }]], X, Y + LH * 11.6, S);
    text([['如需撤销，运行 coding-helper restore', C.muted, { alpha: k }]], X, Y + LH * 13, S);
  }
  ctx.restore();
  // 右：settings.json
  ctx.save(); clipWindow(R_WIN);
  X = R_WIN.x + 44; Y = R_WIN.y + R_WIN.bar + 50;
  const J = [
    [['{', C.fg]],
    [['  "env": {', C.fg]],
    [['    "ANTHROPIC_BASE_URL": ', C.claude], ['"https://api.qnaigc.com"', C.qiniu], [',', C.fg]],
    [['    "ANTHROPIC_AUTH_TOKEN": ', C.claude], ['"sk-••••3f9a"', C.muted], [',', C.fg]],
    [['    "API_TIMEOUT_MS": ', C.claude], ['"3000000"', C.fg], [',', C.fg]],
    [['    "CLAUDE_CODE_DISABLE_', C.claude]],
    [['      NONESSENTIAL_TRAFFIC": ', C.claude], ['"1"', C.fg]],
    [['  }', C.fg]],
    [['}', C.fg]],
  ];
  const hl = [[2, .6], [3, 1.25], [4, 1.875], [5, 2.5], [6, 2.5]];
  J.forEach((segs, i) => {
    const y = Y + LH * (i + .2);
    const h = hl.find(([r]) => r === i);
    if (h) {
      const k = clamp((u - h[1]) / .15) * (1 - clamp((u - h[1] - .55) / .4) * .7);
      if (k > 0) {
        ctx.fillStyle = `rgba(217,119,87,${.16 * k})`; ctx.fillRect(R_WIN.x + 20, y - LH / 2, R_WIN.w - 40, LH);
        ctx.fillStyle = `rgba(217,119,87,${.9 * k})`; ctx.fillRect(R_WIN.x + 20, y - LH / 2, 4, LH);
      }
      text(segs, X, y, S, 0);
      // 未写入前这几行是空的
    } else text(segs, X, y, S);
  });
  ctx.restore();
  // 文件夹从右窗飞进左窗的 backups 路径
  const fk = easeInOut((u - 3.0) / .6);
  if (u >= 3.0 && u < 3.75) {
    const P = [[1400, 300], [1300, 120], [700, 220], [L_WIN.x + 200, L_WIN.y + L_WIN.bar + 50 + 40 * 10.6]];
    const [fx, fy] = bez(P, fk);
    // 落地前淡出，避免盖住路径文字
    ctx.save(); ctx.globalAlpha = 1 - clamp((fk - .75) / .25); ctx.translate(fx, fy); ctx.rotate((1 - fk) * .5);
    ctx.fillStyle = C.qiniu; ctx.shadowColor = C.qiniu; ctx.shadowBlur = 20;
    rr(-34, -18, 30, 12, 3); ctx.fill(); rr(-34, -10, 68, 40, 5); ctx.fill();
    ctx.restore();
  }
  shotEnd();
}

// S11 1:02.5–1:07.5  左 doctor 逐项打勾，右 restore 倒带
function S11(u) {
  backdrop();
  camera(1.0);
  terminal('coding-helper doctor', null, L_WIN);
  const rw = u >= 2.5 && u < 4.2;
  terminal('coding-helper restore', rw ? 'rgba(217,119,87,0.25)' : null, R_WIN);
  const S = 24, LH = 42;
  ctx.save(); clipWindow(L_WIN);
  let X = L_WIN.x + 44, Y = L_WIN.y + L_WIN.bar + 50;
  text([['❯ ', C.qiniu], ['npx qiniu-coding-helper doctor', C.white]], X, Y, S);
  text([['── 健康检查 ──', C.muted]], X, Y + LH * 1.2, S);
  const checks = [['配置文件', '通过'], ['API Key', '通过'], ['网络连接', '连接正常'], ['Claude Code 安装状态', '已找到'], ['Git', '已找到'], ['Node.js', '通过']];
  checks.forEach(([a, b], i) => {
    const at = .3 + i * BEAT / 2;
    if (u < at) return;
    const k = easeOut((u - at) / .15);
    text([['✔ ', C.ok, { glow: 12 * (1 - k) + 4 }], [pad(a, 22), C.fg], [b, C.ok]], X, Y + LH * (2.4 + i), S);
  });
  ctx.restore();
  // 右：restore
  ctx.save(); clipWindow(R_WIN);
  X = R_WIN.x + 44; Y = R_WIN.y + R_WIN.bar + 50;
  text([['❯ ', C.qiniu], ['npx qiniu-coding-helper restore', C.white]], X, Y, S);
  if (u >= 2.0) text(DONE('确定要移除七牛配置并还原原有配置吗？', '是'), X, Y + LH * 1.2, S);
  const env = [['ANTHROPIC_BASE_URL', '"https://api.qnaigc.com"'], ['ANTHROPIC_AUTH_TOKEN', '"sk-••••3f9a"'],
    ['API_TIMEOUT_MS', '"3000000"'], ['CLAUDE_CODE_DISABLE_…', '"1"']];
  text([['~/.claude/settings.json', C.muted]], X, Y + LH * 2.6, S);
  // 倒带：从最后一行往上逐行消失
  env.forEach(([k, v], i) => {
    const gone = clamp((u - (2.6 + (env.length - 1 - i) * .35)) / .25);
    if (gone >= 1) return;
    const y = Y + LH * (3.6 + i);
    const jit = rw ? (hash(Math.floor(u * 24) + i) - .5) * 18 : 0;
    ctx.save(); ctx.globalAlpha = 1 - gone;
    text([['  ' + k + ': ', C.claude], [v, C.qiniu]], X + jit, y, S);
    if (gone > 0) { ctx.fillStyle = C.claude; ctx.fillRect(X, y - 1, (dispWidth(k + v) + 4) * S * .6 * gone, 3); }
    ctx.restore();
  });
  if (u >= 4.2) {
    const k = easeOut((u - 4.2) / .2);
    text([['✔ ', C.ok], ['已还原 Claude Code：七牛配置已移除，原值已写回', C.fg, { alpha: k }]], X, Y + LH * 3.8, S);
  }
  // 倒带画面：扫描线 + 标记
  if (rw) {
    for (let i = 0; i < 7; i++) {
      const y = R_WIN.y + ((hash(i + Math.floor(u * 12)) * R_WIN.h) | 0);
      ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(R_WIN.x, y, R_WIN.w, 3 + hash(i) * 6);
    }
    ctx.font = `700 34px ${MONO}`; ctx.fillStyle = C.claude; ctx.textBaseline = 'middle';
    if (Math.floor(u / (BEAT / 2)) % 2 === 0) ctx.fillText('◀◀ REWIND', R_WIN.x + R_WIN.w - 270, R_WIN.y + R_WIN.h - 50);
  }
  ctx.restore();
  shotEnd();
}

// S12 1:07.5–1:15  呼应开场：同机位，这次 Clawd 自己敲命令，挥手，尾卡定格
function S12(u) {
  backdrop();
  const pull = easeInOut((u - 1.0) / 3.8);
  camera(lerp(1.15, 1.0, pull), W * .42, H * .42);
  const card = easeOut((u - 5.0) / .5);
  ctx.save(); ctx.globalAlpha = lerp(1, .25, card);
  terminal('~/my-project — zsh');
  ctx.save(); clipWindow();
  const X = WIN.x + 64, Y = WIN.y + WIN.bar + 56, S = 30, LH = 46;
  text([['~/my-project', C.muted]], X, Y, S);
  const cmd = 'npx qiniu-coding-helper';
  const n = Math.floor(clamp((u - 1.25) / 1.6) * cmd.length);
  const end = text([['❯ ', C.qiniu], [cmd.slice(0, n), C.white]], X, Y + LH, S);
  cursor(X + end * S * .6 + 4, Y + LH, S, blinkOn(u));
  // 打字时每个八分音符蹦一下；打完挥手（举手/放下交替）
  const typing = u >= 1.25 && u < 2.85;
  const ph = (u % (BEAT / 2)) / (BEAT / 2);
  const hop = typing ? Math.sin(Math.PI * ph) * 10 : 0;
  const wave = u >= 3.75 && Math.floor(u / (BEAT / 2)) % 2 === 0;
  crab(u < 1.25 ? 'idle' : wave ? 'curious' : 'happy', WIN.x + WIN.w * .58, WIN.y + WIN.h - 70 - hop, 14);
  ctx.restore();
  ctx.restore();
  shotEnd();
  // 尾卡
  if (card > 0) {
    ctx.save(); ctx.globalAlpha = card;
    ctx.fillStyle = 'rgba(4,5,7,0.55)'; ctx.fillRect(0, 0, W, H);
    const lit = LOGO.map(() => 1);
    logo(W / 2 - 34 * 13 / 2, 250, 13, 22, lit);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `700 76px ${MONO}`;
    const w = ctx.measureText('❯ npx qiniu-coding-helper').width;
    ctx.fillStyle = C.qiniu; ctx.fillText('❯', W / 2 - w / 2 + 22, 520);
    ctx.fillStyle = C.white; ctx.shadowColor = 'rgba(255,255,255,.35)'; ctx.shadowBlur = 20;
    ctx.fillText('npx qiniu-coding-helper', W / 2 + 46, 520);
    ctx.shadowBlur = 0;
    ctx.fillStyle = C.claude; ctx.fillRect(W / 2 - w / 2, 578, w * easeOut((u - 5.2) / .6), 4);
    ctx.font = `400 34px ${CJK}`; ctx.fillStyle = C.muted;
    ctx.fillText('获取 API Key：portal.qiniu.com', W / 2, 650);
    ctx.restore();
  }
}

// 尚未制作的镜头：场记板
const SHOTS = [
  ['S01', 0, 5, S01], ['S02', 5, 10, S02], ['S03', 10, 15, S03], ['S04', 15, 20, S04], ['S05', 20, 27.5, S05], ['S06', 27.5, 35, S06],
  ['S07', 35, 42.5, S07], ['S08', 42.5, 47.5, S08], ['S09', 47.5, 52.5, S09], ['S10', 52.5, 62.5, S10], ['S11', 62.5, 67.5, S11], ['S12', 67.5, 75, S12],
];
function slate(name, t) {
  backdrop();
  ctx.font = `700 120px ${MONO}`; ctx.fillStyle = C.dim; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(name, W / 2, H / 2 - 40);
  ctx.font = `400 34px ${CJK}`; ctx.fillStyle = C.muted; ctx.fillText(`待制作 · ${t.toFixed(2)} s`, W / 2, H / 2 + 60);
  ctx.textAlign = 'left';
}

// 角色设定稿
function modelSheet() {
  backdrop();
  ctx.font = `700 56px ${CJK}`; ctx.fillStyle = C.white; ctx.textBaseline = 'middle';
  ctx.fillText('Clawd · 角色设定', 120, 120);
  ctx.font = `400 26px ${CJK}`; ctx.fillStyle = C.muted;
  ctx.fillText('18 × 10 格（取自 Claude Code 启动 Logo）· 画面中每格 10–14 px · 只在整格上移动，镜头与光照逐帧平滑', 120, 180);
  const poses = [['idle', '待机'], ['curious', '困惑 / 抬头'], ['happy', '开心 / 跳舞'], ['plug', '插座通电']];
  poses.forEach(([p, label], i) => {
    const x = 300 + i * 440, y = 620;
    ctx.strokeStyle = C.winEdge; ctx.lineWidth = 1; rr(x - 190, 300, 380, 420, 12); ctx.stroke();
    if (p === 'plug') {
      const s = crab('idle', x, y, 20, { socket: true, socketLit: 1 });
      ctx.save(); ctx.fillStyle = '#d9e6ee'; ctx.shadowColor = C.qiniu; ctx.shadowBlur = 18; rr(s.x - 46, s.y - 16, 38, 32, 5); ctx.fill(); ctx.restore();
      ctx.save(); ctx.strokeStyle = C.qiniu; ctx.lineWidth = 6; ctx.shadowColor = C.qiniu; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.moveTo(s.x - 46, s.y); ctx.bezierCurveTo(s.x - 120, s.y, s.x - 120, s.y + 120, s.x - 160, s.y + 130); ctx.stroke(); ctx.restore();
    } else crab(p, x, y, 20);
    if (p === 'curious') { ctx.font = `700 64px ${MONO}`; ctx.fillStyle = C.claude; ctx.fillText('?', x + 120, 360); }
    ctx.font = `500 28px ${CJK}`; ctx.fillStyle = C.fg; ctx.textAlign = 'center';
    ctx.fillText(label, x, 680); ctx.textAlign = 'left';
  });
  // 跳舞节奏：落拍压缩
  ctx.font = `400 24px ${CJK}`; ctx.fillStyle = C.muted;
  ctx.fillText('踩拍：每拍弹起一次，落拍瞬间压扁 14%', 120, 790);
  [0, .06, .25, .5, .75, .95].forEach((ph, i) => {
    const hop = Math.sin(Math.PI * ph) * 40, squash = ph < .12 ? (1 - ph / .12) * .14 : 0;
    crab('happy', 220 + i * 190, 960 - hop, 8, { squash });
  });
  // 色板
  const sw = [['#d97757', 'Clawd 橙'], ['#1a0f0b', '眼睛'], ['#00b4e6', '七牛蓝'], ['#005c99', '七牛深蓝'], ['#00e5a0', '已接入绿'], ['#0a0d12', '终端底']];
  sw.forEach(([c, n], i) => {
    const x = 1360 + (i % 2) * 230, y = 800 + Math.floor(i / 2) * 80;
    ctx.fillStyle = c; rr(x, y, 52, 52, 8); ctx.fill(); ctx.strokeStyle = C.winEdge; ctx.stroke();
    ctx.font = `400 22px ${CJK}`; ctx.fillStyle = C.fg; ctx.fillText(n, x + 68, y + 18);
    ctx.font = `400 18px ${MONO}`; ctx.fillStyle = C.muted; ctx.fillText(c, x + 68, y + 40);
  });
  vignette();
}

window.DUR = 75;
window.render = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  ctx.clearRect(0, 0, W, H);
  if (new URLSearchParams(location.search).has('sheet')) return modelSheet();
  const s = SHOTS.find(([, a, b]) => t >= a && t < b) || SHOTS[SHOTS.length - 1];
  if (s[3]) s[3](t - s[1]); else slate(s[0], t);
  vignette();
  subtitle(t);
};
window.READY = false;
Promise.all([`400 30px "JetBrains Mono"`, `700 30px "JetBrains Mono"`, `400 30px "WenQuanYi Zen Hei"`].map((f) => document.fonts.load(f)))
  .finally(() => { window.READY = true; window.render(Number(new URLSearchParams(location.search).get('t') || 0)); });
</script>
</body>
</html>
